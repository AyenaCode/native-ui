# Push to main → lint + typecheck → publish cli/ to npm (if version is new) → tag v<version>.
# Release = bump cli/package.json version (`npm version patch --no-git-tag-version`) and push.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
      id-token: write # npm trusted publishing (OIDC), no token needed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; early Node 24 builds ship older npm.
      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - name: Read version
        id: v
        working-directory: cli
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.v.outputs.published == 'false'
        working-directory: cli
        run: npm publish

      - name: Tag v${{ steps.v.outputs.version }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

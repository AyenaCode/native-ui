# Push to main → lint + typecheck → stage cli/ on npm (if version is new) → tag v<version>.
# Release = bump cli/package.json version (`npm version patch --no-git-tag-version`), push,
# then approve the staged version on npmjs.com → Staged Packages (2FA).
# The tag marks "already staged or published", so re-pushing never stages twice.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
      id-token: write # npm trusted publishing (OIDC), no token needed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # `npm stage` needs npm >= 11.15; early Node 24 builds ship older npm.
      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - name: Read version
        id: v
        working-directory: cli
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Staged publishing (OIDC): the version waits for a maintainer approval with 2FA.
      - name: Stage on npm
        if: steps.v.outputs.published == 'false' && steps.v.outputs.tagged == 'false'
        working-directory: cli
        run: |
          node scripts/build-registry.mjs
          npm stage publish

      - name: Tag v${{ steps.v.outputs.version }}
        if: steps.v.outputs.tagged == 'false'
        run: |
          git tag "v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"
